<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGY - Custom Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- Neon Aura và Bong bóng Hydro tự động chạy mặc định -->
<body class="neon-active">

  <!-- Hiệu ứng bong bóng Hydro chạy ngầm mặc định -->
  <div class="particles-container" id="particlesContainer"></div>

  <!-- Thanh Navbar -->
  <header class="navbar">
    <!-- LOGO LOGY CẦU KỲ DẠNG VECTOR SVG -->
    <div class="logo-container" title="LOGY">
      <svg class="logy-icon" width="38" height="38" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hydroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7dd3fc" />
            <stop offset="50%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" stroke="url(#hydroGrad)" stroke-width="2" fill="rgba(8, 18, 31, 0.6)" />
        <polygon points="32,9 52,21 52,43 32,55 12,43 12,21" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3" opacity="0.7" />
        <path d="M32 16C32 16 21 28.5 21 36C21 42.0751 25.9249 47 32 47C38.0751 47 43 42.0751 43 36C43 28.5 32 16 32 16Z" fill="url(#hydroGrad)" filter="url(#glow)" />
        <path d="M29 29V39H36" stroke="#08121f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>

      <div class="logy-text">
        <span class="letter-main">LOG</span><span class="letter-accent">Y</span>
        <div class="logy-underline"></div>
      </div>
    </div>

    <!-- Nút Menu 3 gạch / Dấu X -->
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Bảng tiện ích xổ xuống -->
  <aside class="dropdown-menu" id="dropdownMenu">
    <div class="menu-header">
      <h3>Tiện ích nhanh</h3>
    </div>
    <div class="utility-list">
      <button class="utility-item" id="btnChangeColor">
        <span>🎨 Đổi tone màu nền</span>
        <span class="badge">Đổi</span>
      </button>

      <button class="utility-item" id="btnToggleClock">
        <span>⏰ Đồng hồ thời gian thực</span>
        <span class="badge" id="clockStatus">Tắt</span>
      </button>

      <button class="utility-item" id="btnToggleNote">
        <span>📝 Ghi chú nhanh (Tự lưu)</span>
        <span class="badge" id="noteStatus">Tắt</span>
      </button>

      <button class="utility-item" id="btnTogglePomo">
        <span>🎯 Đếm ngược tập trung 25p</span>
        <span class="badge" id="pomoStatus">Tắt</span>
      </button>

      <button class="utility-item" id="btnToggleYtb">
        <span>▶️ Trình phát YouTube</span>
        <span class="badge" id="ytbStatus">Tắt</span>
      </button>

      <button class="utility-item" id="btnFullscreen">
        <span>🖥️ Toàn màn hình (F11)</span>
        <span class="badge" id="fsStatus">Mở</span>
      </button>
    </div>
  </aside>

  <!-- Các Widget tiện ích hiển thị trên màn hình khi bật -->
  <div class="floating-clock" id="floatingClock">00:00:00</div>

  <div class="widget-box note-widget" id="noteWidget">
    <div class="widget-title">📝 Ghi chú nhanh</div>
    <textarea id="quickNoteInput" placeholder="Gõ việc cần làm hoặc ý tưởng vào đây (tự động lưu)..."></textarea>
  </div>

  <div class="widget-box pomo-widget" id="pomoWidget">
    <div class="widget-title">🎯 Tập trung (25:00)</div>
    <div class="pomo-time" id="pomoDisplay">25:00</div>
    <div class="pomo-controls">
      <button id="pomoStartBtn">Chạy</button>
      <button id="pomoResetBtn">Đặt lại</button>
    </div>
  </div>

  <!-- WIDGET YOUTUBE HUB (TÌM VIDEO + DANH SÁCH + PHÁT TRỰC TIẾP) -->
  <div class="widget-box ytb-widget" id="ytbWidget">
    <div class="widget-title">▶️ LOGY YouTube (Kéo viền để di chuyển)</div>
    <div class="ytb-search-bar">
      <input type="text" id="ytbInput" placeholder="Tìm video hoặc dán link YouTube..." />
      <button id="ytbSearchBtn">Tìm</button>
    </div>

    <!-- Khung phát video -->
    <div class="ytb-player-wrapper">
      <iframe
        id="ytbIframe"
        src=""
        title="YouTube Player"
        frameborder="0"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
      <div class="ytb-placeholder" id="ytbPlaceholder">
        Gõ từ khóa rồi bấm <b>Tìm</b> để chọn video phát ngay tại đây!
      </div>
    </div>

    <!-- Thanh trạng thái / mở ngoài nếu video chặn nhúng -->
    <div class="ytb-meta-bar">
      <span id="ytbStatusText">Sẵn sàng tìm kiếm</span>
      <a id="ytbExternalLink" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">Mở trên YouTube ↗</a>
    </div>

    <!-- Danh sách kết quả tìm kiếm như YouTube thật -->
    <div class="ytb-results" id="ytbResults"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
